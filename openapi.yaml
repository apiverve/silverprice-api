openapi: 3.0.4
info:
  title: Silver Price
  description: >-
    Silver Price quotes spot silver prices per troy ounce, gram, and kilogram in
    US dollars, including 24-hour price change and trend direction. Paid plans
    can request quotes across 172 currencies, 24-hour high and low ranges, and
    hourly price snapshots.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/silverprice:
    get:
      summary: Silver Price
      description: >-
        Get the current price of silver. You can optionally specify a currency
        (defaults to USD).
      operationId: silverprice
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: The currency to get the price in
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include hourly price data for the past 24 hours
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  currency: USD
                  gram: 1.58
                  kilogram: 1584.07
                  ounce: 49.27
                  lastUpdated: '2026-02-07T12:00:00.000Z'
                  change24h: 0.42
                  change24hPct: 0.86
                  changeDirection: up
                  high24h: 49.55
                  low24h: 48.8
                  formatted:
                    ounce: $49.27
                    gram: $1.58
                    kilogram: $1,584.07
                    ounceWords: forty-nine dollars
                    kilogramWords: one thousand, five hundred eighty-four dollars
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
