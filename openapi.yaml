openapi: 3.0.4
info:
  title: Silver Price
  description: >-
    Silver Price quotes spot silver prices per troy ounce, gram, and kilogram in
    US dollars, including 24-hour price change and trend direction. Paid plans
    add 172 currencies, 24-hour highs and lows, 7- and 30-day changes, 30-day
    stats, and hourly and 30-day daily history.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/silverprice:
    get:
      summary: Silver Price
      description: >-
        Get the current price of silver. You can optionally specify a currency
        (defaults to USD).
      operationId: silverprice
      parameters:
        - name: currency
          in: query
          schema:
            type: string
          required: false
          description: The currency to get the price in
          example: USD
        - name: hourly
          in: query
          schema:
            type: boolean
          required: false
          description: Include hourly price data for the past 24 hours
          example: true
        - name: daily
          in: query
          schema:
            type: boolean
          required: false
          description: Include the daily closing price per ounce for the last 30 days
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
